name: Static site QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install browser QA tooling
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/x0r-axe
          npm pack axe-core@4.14.0 --pack-destination /tmp/x0r-axe --silent
          tar -xzf /tmp/x0r-axe/axe-core-4.14.0.tgz -C /tmp/x0r-axe package/axe.min.js
      - name: Check and serve
        run: |
          node --check site.js
          node --check micro-demo.js
          git diff --check
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/x0r-preview.log 2>&1 &
      - name: Responsive, interaction and accessibility checks
        run: |
          python qa/check_site.py
          python qa/check_micro_demo.py
        env:
          X0R_QA_URL: http://127.0.0.1:8765/
          AXE_PATH: /tmp/x0r-axe/package/axe.min.js
          QA_OUT: /tmp/x0r-site-qa
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: responsive-evidence
          path: /tmp/x0r-site-qa/
          if-no-files-found: warn
          retention-days: 14
